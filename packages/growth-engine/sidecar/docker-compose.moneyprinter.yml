services:
  moneyprinter-api:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: growth-moneyprinter-api
    restart: unless-stopped
    # Keep bound to loopback. Put an authenticated reverse proxy / Cloudflare Tunnel + Access in front.
    ports:
      - "127.0.0.1:8080:8080"
    command: ["python3", "main.py"]
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml:ro
      - ./storage:/MoneyPrinterTurbo/storage

# SECURITY:
# The upstream v1 API router currently does not enforce its optional token dependency.
# Do not expose port 8080 directly to the internet. Use an authenticated gateway.
